<!-- ==========================================================================
     1. HELPER: ESCAPE HTML  (taruh sebelum "const App = {")
     Dipakai untuk semua nilai yang berasal dari pengguna (nama supir, plat,
     alamat SPBU, dll.) sebelum dimasukkan ke innerHTML.
     ========================================================================== -->
<script>
  const BBM = {
    esc: function (s) {
      return String(s === null || s === undefined ? '' : s).replace(
        /[&<>"']/g,
        function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                   '"': '&quot;', "'": '&#39;' }[c];
        }
      );
    },

    /* Pembungkus google.script.run: SELALU menutup spinner dan mengaktifkan
       kembali tombol, baik sukses maupun gagal. Menggantikan pola lama yang
       hanya memasang withSuccessHandler -> spinner bisa menggantung selamanya. */
    run: function (fnName, args, opts) {
      opts = opts || {};
      Swal.fire({ title: opts.loadingText || 'Memproses...',
                  didOpen: function () { Swal.showLoading(); },
                  allowOutsideClick: false });
      var done = false;
      function finish(ok, payload) {
        if (done) return;
        done = true;
        Swal.close();
        if (opts.onFinally) opts.onFinally();
        if (ok) { (opts.onSuccess || function () {})(payload); }
        else    { (opts.onError   || function (m) {
                    Swal.fire('Gagal', m || 'Terjadi kesalahan sistem.', 'error');
                  })(payload); }
      }
      var runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.status === 'error') return finish(false, res.message);
          finish(true, res);
        })
        .withFailureHandler(function (err) {
          finish(false, (err && err.message) || String(err));
        });
      runner[fnName].apply(runner, args || []);
    },

    /* Kompres foto kamera sebelum dikirim.
       Foto 4-8 MB -> ~200-350 KB, menghemat kuota Drive & menghindari timeout. */
    compressImage: function (file, maxSide, quality) {
      maxSide = maxSide || 1280;
      quality = quality || 0.72;
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('Gagal membaca file.')); };
        reader.onload = function (e) {
          var img = new Image();
          img.onerror = function () { reject(new Error('File bukan gambar valid.')); };
          img.onload = function () {
            var w = img.width, h = img.height;
            var scale = Math.min(1, maxSide / Math.max(w, h));
            var cw = Math.round(w * scale), ch = Math.round(h * scale);
            var canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
  };
</script>
